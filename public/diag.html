<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arbor diagnostics</title>
<script src="./telemetry.js"></script>
<style>
  body { margin: 0; padding: 14px; font: 15px/1.45 ui-sans-serif, system-ui, sans-serif; background: #1c2126; color: #e8ecef; }
  h1 { font-size: 18px; margin: 0 0 6px; } h2 { font-size: 15px; margin: 18px 0 6px; color: #9fc39a; }
  a { display: block; padding: 11px 12px; margin: 6px 0; border-radius: 7px; background: #2c343b; color: #fff; text-decoration: none; }
  a small { display: block; color: #a9b3bb; font-size: 12px; }
  pre { white-space: pre-wrap; word-break: break-all; font: 12px/1.4 ui-monospace, monospace; background: #12161a; padding: 10px; border-radius: 7px; }
  .sid { color: #a9b3bb; font-size: 12px; }
</style>
</head>
<body>
<h1>Arbor diagnostics</h1>
<div class="sid">Every page load is logged to the server. Opening this page resets the crash counter (the app turns safe mode on by itself after a GPU crash). Tap one link, wait until it crashes (or ~60 s), come back here, try the next.</div>
<h2>Bisect runs</h2>
<div id="links"></div>
<h2>This device</h2>
<pre id="dev">…</pre>
<h2>Previous run on this tab</h2>
<pre id="prev">…</pre>
<script>
  var L = [
    ['./?ladder=1', 'Test leaf variants (leave the phone for 2 min)', 'tries leaf variants V4 to V0, 20 s each, reloads itself after a GPU crash; results go to telemetry'],
    ['./?leafvariant=0', 'Leaf variant V0', 'known-good: card + leaf map + alphaTest (PowerVR default)'],
    ['./?leafvariant=1', 'Leaf variant V1', 'V0 + emissive'],
    ['./?leafvariant=2', 'Leaf variant V2', 'V0 + vertexColors'],
    ['./?leafvariant=3', 'Leaf variant V3', 'leaf polygon + uv + 1x1 white map + alphaTest'],
    ['./?leafvariant=4', 'Leaf variant V4', 'leaf polygon, vertexColors, emissive, no map (crashed PowerVR in 0d41a74)'],
    ['./?leafmap=raw', 'Raw leaf map', 'old canvas leaf map with GPU mips (ghost-card comparison)'],
    ['./', 'Normal app', 'baseline: does it still crash?'],
    ['./?safe=1', 'Safe mode', 'no shadows, no leaves, basic sky, no growth, no antialias'],
    ['./?safe=1&grow=1', 'Safe + growth', 'only the growing branch mesh + light grid'],
    ['./?grow=0&t=40', 'Static grown tree', 'fast-forward 40 s then freeze: all rendering, no rebuilds'],
    ['./?leafsafe=1', 'Safe leaves', 'Lambert leaves, no shader patch, no leaf shadows, no wind (auto on PowerVR / mobile)'],
    ['./?leafsafe=0', 'Full leaves (force)', 'original leaf shader even on PowerVR: expect the crash'],
    ['./?leafsafe=0&leafshadow=0', 'Full leaves, no leaf shadows', 'isolates the leaf shadow/depth pass'],
    ['./?leafshader=basic', 'Unlit leaves', 'MeshBasicMaterial leaves (if safe leaves still crash)'],
    ['./?leafshader=basic&shadows=0', 'Unlit leaves, no shadows', 'smallest leaf shader, no shadow map'],
    ['./?shadows=0', 'No shadows', 'shadow map off'],
    ['./?leaves=0', 'No leaves', 'no instanced leaves'],
    ['./?sky=basic', 'Basic sky', 'no Preetham sky, no PMREM environment bakes'],
    ['./?antialias=0', 'No antialias', 'MSAA off'],
    ['./?maxNodes=2000', 'Small tree', 'maxNodes 2000'],
    ['./?rebuildHz=2', 'Slow rebuilds', 'branch mesh rebuilt 2x per second'],
    ['./?rebuildHz=30', 'Fast rebuilds', 'branch mesh rebuilt 30x per second (stress)'],
    ['./?quality=High', 'Desktop quality', 'post-processing, DPR 1.5, 2048 shadows'],
  ];
  document.getElementById('links').innerHTML = L.map(function (l) { return '<a href="' + l[0] + '">' + l[1] + '<small>' + l[0].slice(2 + 0) + ' — ' + l[2] + '</small></a>'; }).join('');
  try { sessionStorage.removeItem('arbor.ctxLost'); } catch (e) {}
  var T = window.__tel || { device: function () { return { err: 'telemetry.js not loaded' }; }, probeGl: function () { return {}; }, sid: '?' };
  var d = {}, g = {};
  try { d = T.device(); } catch (e) { d = { err: String(e) }; }
  // The GL probe opens a WebGL context; skip it unless asked, so a wedged GPU cannot break this page.
  try { g = /probe=1/.test(location.search) ? T.probeGl() : { skipped: 'add ?probe=1 to probe WebGL' }; } catch (e) { g = { err: String(e) }; }
  function render() {
    d.inner = [innerWidth, innerHeight];
    var pm = performance.memory;
    document.getElementById('dev').textContent =
      'session ' + T.sid + '\n' + JSON.stringify({ device: d, gl: g, jsHeapMB: pm ? +(pm.usedJSHeapSize / 1048576).toFixed(1) : null }, null, 1);
  }
  render(); setInterval(render, 1000);
  try {
    var p = T.prev && T.prev();
    document.getElementById('prev').textContent = p ? (p.clean ? 'ended cleanly' : 'DID NOT END CLEANLY (crash/kill) in phase "' + p.phase + '"') + '\n' + JSON.stringify(p, null, 1) : 'none';
  } catch (e) { document.getElementById('prev').textContent = String(e); }
</script>
</body>
</html>
