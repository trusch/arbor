<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10160f" />
    <title>Arbor</title>
    <!-- Telemetry first, classic + synchronous: it must run even if the module bundle fails. -->
    <script src="./telemetry.js"></script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%226%22 r=%225%22 fill=%22%234a7a3a%22/%3E%3Crect x=%227%22 y=%229%22 width=%222%22 height=%227%22 fill=%22%236b4a2e%22/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10160f; }
      canvas { display: block; }
      #hud { position: fixed; left: 12px; bottom: 10px; font: 12px/1.4 ui-monospace, monospace; color: #fff; text-shadow: 0 1px 2px #0008; pointer-events: none; display: none; }
      body.hud #hud { display: block; }
      #overlay { position: fixed; right: 18px; bottom: 14px; font: 300 13px/1.4 ui-sans-serif, system-ui, sans-serif; letter-spacing: 0.06em; color: #fff; text-shadow: 0 1px 3px #0009; pointer-events: none; transition: opacity 0.6s; }
      body.watch #hud { display: none; }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
